name: Build packages

on:
  push:
    branches: [dev, main]

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

jobs:
  win-x86_64:
    name: win-x86_64
    runs-on: ubuntu-24.04
    env:
      # Do NOT name this directory ".vcpkg-root": vcpkg treats a path component /
      # marker of that name as the install root and then mis-detects the repo root.
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg-ci
      VCPKG_DEFAULT_TRIPLET: x64-mingw-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            cmake ninja-build zip curl unzip git tar pkg-config \
            glslang-tools msitools wixl wixl-data python3-pil
          command -v wixl wixl-heat msiinfo
          wixl --version || true

      - name: Checkout vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          path: vcpkg-ci
          fetch-depth: 1

      - name: Cache vcpkg artifacts
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}/installed
            ${{ env.VCPKG_ROOT }}/packages
            ${{ env.VCPKG_ROOT }}/downloads
          key: vcpkg-x64-mingw-static-v3-${{ runner.os }}-libpng-zlib-vulkan-loader

      - name: Bootstrap vcpkg
        run: |
          test -f "${VCPKG_ROOT}/triplets/x64-linux.cmake"
          test -f "${VCPKG_ROOT}/triplets/community/x64-mingw-static.cmake"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics
          "${VCPKG_ROOT}/vcpkg" --vcpkg-root="${VCPKG_ROOT}" version
          "${VCPKG_ROOT}/vcpkg" --vcpkg-root="${VCPKG_ROOT}" help triplets | head -n 40

      - name: Install vcpkg packages
        run: |
          "${VCPKG_ROOT}/vcpkg" --vcpkg-root="${VCPKG_ROOT}" install \
            libpng:x64-mingw-static \
            zlib:x64-mingw-static \
            vulkan-loader:x64-mingw-static

      - name: Install host Qt tools
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: desktop
          arch: linux_gcc_64
          archives: qtbase icu
          cache: true
          cache-key-prefix: qt-host-6.8.3-qtbase-icu
          dir: ${{ github.workspace }}/qt-host

      - name: Install MinGW Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: windows
          target: desktop
          arch: win64_mingw
          archives: qtbase
          cache: true
          cache-key-prefix: qt-mingw-6.8.3-qtbase
          dir: ${{ github.workspace }}/qt-mingw
          set-env: false
          setup-python: false
          install-deps: false

      - name: Record Qt paths
        run: |
          if [[ -z "${QT_ROOT_DIR:-}" ]]; then
            host_cfg="$(find "${{ github.workspace }}/qt-host/Qt" -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print -quit)"
            test -n "${host_cfg}"
            QT_ROOT_DIR="$(cd "$(dirname "${host_cfg}")/../../.." && pwd)"
          fi
          echo "QT_HOST_PATH=${QT_ROOT_DIR}" >> "${GITHUB_ENV}"
          export LD_LIBRARY_PATH="${QT_ROOT_DIR}/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}" >> "${GITHUB_ENV}"
          mingw_cfg="$(find "${{ github.workspace }}/qt-mingw/Qt" -path '*/lib/cmake/Qt6/Qt6Config.cmake' -print -quit)"
          test -n "${mingw_cfg}"
          mingw_root="$(cd "$(dirname "${mingw_cfg}")/../../.." && pwd)"
          echo "WDS_QT_MINGW_ROOT=${mingw_root}" >> "${GITHUB_ENV}"
          echo "Host Qt: ${QT_ROOT_DIR}"
          echo "MinGW Qt: ${mingw_root}"
          test -f "${mingw_root}/lib/cmake/Qt6/Qt6Config.cmake"
          "${QT_ROOT_DIR}/libexec/rcc" -help >/dev/null

      - name: Build and package
        env:
          WDS_VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: ./scripts/build-target.sh win-x86_64

      - name: Upload MSI
        uses: actions/upload-artifact@v6
        with:
          name: wds-win-x86_64
          path: dist/wds-win-x86_64.msi
          if-no-files-found: error
          retention-days: 3

  macos-arm:
    name: macos-arm
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Homebrew dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
        run: |
          # qtbase conflicts with a prelinked qt@5 keg on some images.
          if brew list --versions qt@5 >/dev/null 2>&1; then
            brew unlink qt@5
          fi
          brew install cmake libpng glslang molten-vk vulkan-headers vulkan-loader qtbase

      - name: Setup Python packaging tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install dmgbuild pillow
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Build
        run: ./scripts/build-target.sh macos-arm --no-package

      - name: Test
        run: ctest --test-dir build-macos-arm --output-on-failure

      - name: Package
        run: |
          export PATH="${{ github.workspace }}/.venv/bin:$PATH"
          ./scripts/build-target.sh --package-only macos-arm

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: wds-macos-arm
          path: dist/wds-macos-arm.dmg
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main'
    needs: [win-x86_64, macos-arm]
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          pattern: wds-*
          merge-multiple: true

      - name: Prepare release metadata
        id: meta
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          short_sha="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
          echo "tag=main-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "name=WDS Editor ${short_sha}" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$COMMIT_MSG" > release_notes.md
          echo "---- release_notes.md ----"
          cat release_notes.md
          # Ensure artifacts exist without embedding ls metadata (mode/time/size) in notes.
          test -f artifacts/wds-win-x86_64.msi
          test -f artifacts/wds-macos-arm.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: release_notes.md
          files: |
            artifacts/wds-win-x86_64.msi
            artifacts/wds-macos-arm.dmg
          fail_on_unmatched_files: true
          make_latest: true
